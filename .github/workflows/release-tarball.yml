name: Create Release Tarball

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install GitHub CLI
      run: sudo apt-get update && sudo apt-get install -y gh zip

    - name: Create archives for each theme directory
      run: |
        for d in */ ; do
          dir=${d%/}
          # gzip
          tar -czf "$dir.tar.gz" "$dir"
          # xz
          tar -cJf "$dir.tar.xz" "$dir"
          # zip
          zip -r "$dir.zip" "$dir"
        done

    - name: Upload artifacts (all formats)
      uses: actions/upload-artifact@v4
      with:
        name: theme-archives
        path: |
          *.tar.gz
          *.tar.xz
          *.zip

    - name: Create or update GitHub Release for master
      if: github.ref == 'refs/heads/master'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh release view latest >/dev/null 2>&1; then
          gh release edit latest --title "latest" --notes "Latest master branch archives (Updated $(date -u +'%Y-%m-%d %H:%M UTC'))" --target master
        else
          gh release create latest --title "latest" --notes "Latest master branch archives" --target master
        fi
        gh release upload latest *.tar.gz *.tar.xz *.zip --clobber

    - name: Create or update GitHub Release for tags
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag="${GITHUB_REF#refs/tags/}"
        if gh release view "$tag" >/dev/null 2>&1; then
          gh release edit "$tag" --title "$tag" --notes "Release $tag"
        else
          gh release create "$tag" --title "$tag" --notes "Release $tag"
        fi
        gh release upload "$tag" *.tar.gz *.tar.xz *.zip --clobber
